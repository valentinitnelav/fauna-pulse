plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = (keystoreProperties["storeFile"] ?: System.getenv("ANDROID_STORE_FILE")) &&
    (keystoreProperties["keyAlias"] ?: System.getenv("ANDROID_KEY_ALIAS")) &&
    (keystoreProperties["keyPassword"] ?: System.getenv("ANDROID_KEY_PASSWORD")) &&
    (keystoreProperties["storePassword"] ?: System.getenv("ANDROID_STORE_PASSWORD"))

android {
    namespace = "com.ultralytics.yolo"
    // Pinned instead of flutter.compileSdkVersion (round 158). The Flutter-provided
    // values follow whichever Flutter SDK happens to be installed, so the API level
    // the app is built and tested against could change silently under us. Google Play
    // requires new apps to target API 36 from 2026-08-31, so that number must be a
    // deliberate, reviewable choice. These match Flutter 3.44 defaults, so pinning
    // them changed no behaviour on the day it was introduced.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Pin Kotlin's bytecode target to match Java's (above). Without this, Kotlin
    // defaults to the JDK running the build (21 here), and Gradle refuses to mix
    // Java-17 and Kotlin-21 outputs in the same module ("Inconsistent JVM-target").
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Our own application id (distinct from Ultralytics' com.ultralytics.yolo)
        // so this app installs alongside the official Ultralytics app instead of
        // replacing it, and so saved data lives under
        // Android/data/com.faunapulse.app/ rather than a yolo path.
        // (The internal Kotlin namespace stays com.ultralytics.yolo — it's not
        // user-visible and renaming it would mean moving all native sources.)
        applicationId = "com.faunapulse.app"
        // Pinned (round 158), see the compileSdk note above.
        // minSdk 24 = Android 7.0. The vendored plugin's own floor is 23 (LiteRT),
        // but the release build already dexed at 24, so this changes nothing and
        // keeps the supported-device set stable.
        minSdk = 24
        // targetSdk 36 = Android 16. Required by Google Play for new apps from
        // 2026-08-31. Raising it later means re-testing the camera preview, the
        // recording foreground service and the notification permission, since each
        // Android release tightens those.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties["keyAlias"] ?: System.getenv("ANDROID_KEY_ALIAS")
            keyPassword = keystoreProperties["keyPassword"] ?: System.getenv("ANDROID_KEY_PASSWORD")
            // Keystore path from key.properties (relative paths resolve against
            // android/) or the ANDROID_STORE_FILE environment variable.
            def storeFilePath = keystoreProperties["storeFile"] ?: System.getenv("ANDROID_STORE_FILE")
            storeFile = storeFilePath ? rootProject.file(storeFilePath) : null
            storePassword = keystoreProperties["storePassword"] ?: System.getenv("ANDROID_STORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            // Release builds are always signed with the real release keystore,
            // configured via android/key.properties or ANDROID_* environment
            // variables (both kept out of git). There is deliberately no debug-key
            // fallback: an unconfigured release build fails fast (see the
            // preReleaseBuild guard below) instead of shipping a debug-signed APK.
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // Release lint is a safety gate: API compatibility and manifest errors
        // must fail the build instead of reaching testers or Google Play.
        checkReleaseBuilds true
        abortOnError true
    }

    // The Hexagon DSP loads QNN Skel libraries via filesystem paths (ADSP_LIBRARY_PATH), so they must exist as
    // real files in nativeLibraryDir rather than being mmapped out of the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Flutter 3.44 generates one shared Java plugin registrant containing dev
    // plugins, while its Gradle plugin correctly removes dev dependencies from
    // the release classpath. Compile variant-specific generated copies so release
    // builds omit IntegrationTestPlugin instead of shipping test code or failing.
    sourceSets {
        main.java.exclude("io/flutter/plugins/GeneratedPluginRegistrant.java")
        debug.java.srcDir("$buildDir/generated/fauna_pulse_registrant/debug")
        profile.java.srcDir("$buildDir/generated/fauna_pulse_registrant/profile")
        release.java.srcDir("$buildDir/generated/fauna_pulse_registrant/release")
    }
}

def flutterPluginRegistrant = file(
    "src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"
)
[
    Debug: false,
    Profile: false,
    Release: true,
].each { variant, removeIntegrationTest ->
    def variantLower = variant.toLowerCase()
    def outputDir = file(
        "$buildDir/generated/fauna_pulse_registrant/$variantLower"
    )
    def generateRegistrant = tasks.register(
        "generateFaunaPulse${variant}PluginRegistrant"
    ) {
        inputs.file(flutterPluginRegistrant)
        outputs.dir(outputDir)
        doLast {
            def source = flutterPluginRegistrant.getText("UTF-8")
            def lines = source.readLines()
            def filtered = []
            def index = 0
            while (index < lines.size()) {
                def isIntegrationTestBlock =
                    removeIntegrationTest &&
                    index + 4 < lines.size() &&
                    lines[index].trim() == "try {" &&
                    lines[index + 1].contains("IntegrationTestPlugin") &&
                    lines[index + 2].contains("catch (Exception e)") &&
                    lines[index + 3].contains("integration_test")
                if (isIntegrationTestBlock) {
                    index += 5
                    continue
                }
                filtered.add(lines[index])
                index++
            }
            if (removeIntegrationTest &&
                filtered.any { it.contains("IntegrationTestPlugin") }) {
                throw new GradleException(
                    "Could not remove IntegrationTestPlugin from release registrant."
                )
            }
            def outputFile = new File(
                outputDir,
                "io/flutter/plugins/GeneratedPluginRegistrant.java"
            )
            outputFile.parentFile.mkdirs()
            outputFile.setText(filtered.join("\n") + "\n", "UTF-8")
        }
    }
    tasks.matching {
        it.name == "compile${variant}JavaWithJavac" ||
            it.name == "compile${variant}Kotlin"
    }.configureEach {
        dependsOn(generateRegistrant)
    }
}

// Model weights remain git-ignored. For a release APK, the maintainer chooses
// exactly which local weights to ship by listing their repository-relative paths
// in assets/models/bundled_models.txt. Paths may start with either
// "assets/models/..." or "/fauna-pulse/assets/models/...".
def bundledModelsManifestPath = "assets/models/bundled_models.txt"
def bundledModelsManifest = new File(
    rootProject.projectDir,
    "../${bundledModelsManifestPath}"
)
def flutterProjectDirName = rootProject.projectDir.parentFile.name
def normalizeBundledModelPath = { String listedPath ->
    def path = listedPath.trim().replace('\\', '/')
    while (path.startsWith("./")) path = path.substring(2)
    while (path.startsWith("/")) path = path.substring(1)
    if (path.startsWith("${flutterProjectDirName}/")) {
        path = path.substring(flutterProjectDirName.length() + 1)
    }
    return path
}
def releaseBundledModelEntries = []
if (bundledModelsManifest.isFile()) {
    bundledModelsManifest.eachLine { line ->
        def listedPath = line.trim()
        if (listedPath && !listedPath.startsWith("#")) {
            releaseBundledModelEntries.add([
                listedPath: listedPath,
                assetPath: normalizeBundledModelPath(listedPath),
            ])
        }
    }
}
def releaseBundledModels = releaseBundledModelEntries.collect {
    it.assetPath
}.toSet()

// Check the manifest before a release build. A missing weight is intentionally
// only a warning: the APK still builds, and every other listed model is bundled.
tasks.register("checkReleaseBundledModels") {
    doLast {
        if (!bundledModelsManifest.isFile()) {
            logger.warn(
                "WARNING: ${bundledModelsManifestPath} was not found. " +
                "No local model weights will be bundled in this release APK."
            )
            return
        }

        def missingEntries = releaseBundledModelEntries.findAll {
            !new File(rootProject.projectDir, "../${it.assetPath}").isFile()
        }
        missingEntries.each { entry ->
            logger.warn(
                "WARNING: A model weight listed in ${bundledModelsManifestPath} " +
                "does not exist and will not be bundled:\n" +
                "    ${entry.listedPath}\n" +
                "Check the path in ${bundledModelsManifestPath} or place the " +
                "model file at that location. The release build will continue."
            )
        }

        def foundCount = releaseBundledModelEntries.size() - missingEntries.size()
        logger.lifecycle(
            "Release model bundle: ${foundCount} of " +
            "${releaseBundledModelEntries.size()} listed model file(s) found."
        )
    }
}

// Fail fast before compilation only when release signing is missing. Debug and
// profile builds are unaffected; missing model weights are handled above.

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn("checkReleaseBundledModels")
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "Release signing is not configured, refusing to build a release APK " +
                "with the debug key.\n\n" +
                "Create android/key.properties (git-ignored, never commit it) with:\n\n" +
                "    storeFile=/absolute/path/to/faunapulse-release.jks\n" +
                "    storePassword=<keystore password>\n" +
                "    keyAlias=<key alias>\n" +
                "    keyPassword=<key password>\n\n" +
                "or set the ANDROID_STORE_FILE, ANDROID_STORE_PASSWORD, " +
                "ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD environment variables.\n\n" +
                "To create a keystore (one-time), from the repository root:\n" +
                "    bash scripts/create_release_keystore.sh\n" +
                "(it also writes android/key.properties; see docs/INSTALL.md section B4)\n\n" +
                "Debug builds (flutter run / flutter build apk --debug) are unaffected."
            )
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Snapdragon NPU support for QNN context-binary ONNX models (*_qnn.onnx). The plugin declares this compileOnly;
    // apps opt in to the ~70MB arm64 runtime by adding it here.
    implementation("com.microsoft.onnxruntime:onnxruntime-android-qnn:1.26.0")
    // Override the AAR's transitive QAIRT 2.42 with 2.46: 2.42's device table predates the
    // Snapdragon 8 Elite Gen 5 (SM8850), failing QnnDevice_create with INVALID_CONFIG.
    implementation("com.qualcomm.qti:qnn-runtime:2.46.0")
}

// pubspec.yaml declares both model directories so local debug builds can use any
// ignored test weight without editing source. For release builds, filter the
// Flutter asset copy to the paths read from bundled_models.txt. Keep the manifest
// itself in the APK so the Dart model catalog can apply the same list at runtime.
// Source model files are never changed or removed.
tasks.matching { it.name == "copyFlutterAssetsRelease" }.configureEach {
    eachFile { details ->
        def path = details.path.replace('\\', '/')
        def prefix = "flutter_assets/"
        def modelPrefix = "${prefix}assets/models/"
        if (path.startsWith(modelPrefix)) {
            def assetPath = path.substring(prefix.length())
            if (assetPath != bundledModelsManifestPath &&
                !releaseBundledModels.contains(assetPath)) {
                details.exclude()
            }
        }
    }
}
