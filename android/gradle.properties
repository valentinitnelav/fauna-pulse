org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Off since round 350 (perf review H5): `./gradlew checkJetifier` found no legacy support
# library in any project, so nothing needs the jar rewrite it did on every build.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# LiteRT 2.2.0 ships its Kotlin API (litert-api) and its runtime (litert) with the same Android
# namespace, com.google.ai.edge.litert, and the Android Gradle plugin refuses two libraries with
# one namespace unless this check is off ("Namespace ... is used in multiple modules and/or
# libraries" at manifest merging). Nothing else in the build shares a namespace.
android.uniquePackageNames=false
