name: Bug report
description: Report a problem, crash or unexpected behaviour in FaunaPulse.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FaunaPulse. It is in beta, so bug reports are especially
        valuable. One problem per issue, please.

        **Tip:** in the app, **Menu → Send feedback** makes one zip file with the technical
        details (app version, phone, settings, recent log lines and sample files of one
        session; locations are removed). Attaching it below gives us far more to work with.
        Everything on this page is public: to send the zip privately, use **Send by email** on
        that screen instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >-
        What did you do, in order, leading up to the problem? Name screens by the title at
        their top.
      placeholder: |
        1. On Home, tapped ...
        2. On the screen "...", chose ...
        3. After about N minutes ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Menu → About FaunaPulse, for example v0.12.0-beta.1 (build 17).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      description: For example "Xiaomi 11T Pro, Android 14" or "Samsung Galaxy A54, Android 14".
    validations:
      required: false
  - type: input
    id: context
    attributes:
      label: What were you doing?
      description: >-
        For example a camera session (live detection, motion or time-lapse), imported videos,
        identification, the Dashboard.
    validations:
      required: false
  - type: input
    id: model
    attributes:
      label: Detection model in use
      description: Which model was selected, if any (a model from the app's list or your own file).
    validations:
      required: false
  - type: textarea
    id: diagnostic-report
    attributes:
      label: Screenshots and diagnostic report
      description: >-
        Drag files into this box: screenshots (underline or circle the problem) and the zip
        from Menu → Send feedback. Remember that this page is public.
    validations:
      required: false
