name: Security and release checks

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to a commit (a tag can be moved to other code); Dependabot updates
      # the commit and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The committed gradle-wrapper.jar files must be the ones Gradle publishes.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep equal to the Flutter that builds the release (`flutter --version`
          # on the build computer): tests written on a newer Flutter fail on an older one.
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Resolve application dependencies
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze

      - name: Run application regression tests
        run: flutter test test/fauna_pulse

      - name: Run Ultralytics plugin tests (packages/ultralytics_yolo)
        working-directory: packages/ultralytics_yolo
        run: |
          flutter pub get
          flutter test

      - name: Run native metadata security tests and Android lint
        working-directory: android
        run: ./gradlew :ultralytics_yolo:testDebugUnitTest :app:lintDebug

      - name: Build debug app bundle as an unsigned compile/package check
        run: flutter build appbundle --debug

      - name: Explain signed release gate
        run: |
          echo "Run scripts/security_release_gate.sh locally with the real"
          echo "release keystore before uploading an AAB to Google Play."
